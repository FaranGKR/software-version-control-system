spring.application.name=versions

# =====================================================================
# DATA SOURCE CONFIGURATION
# =====================================================================
# Replace "your_database_name" with the actual schema created in MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/version_control_system?useSSL=false&serverTimezone=UTC

# Your MySQL server login credentials
spring.datasource.username=root
spring.datasource.password=123456789

# Driver class name (Optional for modern Spring Boot versions as it auto-detects)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================================
# Automatically updates the database schema based on your Java Entity classes
spring.jpa.hibernate.ddl-auto=update

# Prints all generated SQL statements to the console log (Useful for debugging)
spring.jpa.show-sql=true

# Formats the printed SQL statements to be cleanly readable
spring.jpa.properties.hibernate.format_sql=true

# Explicitly specifies the SQL engine dialect (Optional for modern Spring Boot)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
